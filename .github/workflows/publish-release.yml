name: publish verified release

on:
  push:
    tags:
      - 'publish-v*'

# Temporary, deliberately narrow release-promotion path. A
# `publish-<release-tag>` trigger promotes only an existing draft after
# re-downloading and verifying every expected asset. This workflow is removed
# from main immediately after the authorized release is published.
permissions:
  contents: write

concurrency:
  group: publish-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: verify assets and publish pre-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Resolve authorized draft
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          trigger_tag="$GITHUB_REF_NAME"
          release_tag="${trigger_tag#publish-}"
          if [[ "$release_tag" == "$trigger_tag" || "$release_tag" != v* ]]; then
            echo "::error title=Invalid publish trigger::$trigger_tag does not map to a v* release tag"
            exit 1
          fi

          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag")"
          is_draft="$(jq -r '.draft' <<<"$release_json")"
          if [[ "$is_draft" != true ]]; then
            echo "::error title=Release is not a draft::$release_tag has draft=$is_draft; refusing to publish"
            exit 1
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_id=$(jq -r '.id' <<<"$release_json")" >> "$GITHUB_OUTPUT"
          echo "Draft assets reported by GitHub:"
          jq -r '.assets[] | "- \(.name) (\(.size) bytes)"' <<<"$release_json"

      - name: Download release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail

          asset_dir="$RUNNER_TEMP/release-assets"
          rm -rf "$asset_dir"
          mkdir -p "$asset_dir"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$asset_dir"
          ls -lah "$asset_dir"

      - name: Verify asset set
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail

          asset_dir="$RUNNER_TEMP/release-assets"
          base="macrdp-${RELEASE_TAG}-aarch64-apple-darwin"

          expected=(
            "$base.dmg"
            "$base-app.zip"
            "$base.tar.gz"
            "SHA256SUMS"
          )
          for name in "${expected[@]}"; do
            if [[ ! -s "$asset_dir/$name" ]]; then
              downloaded="$(find "$asset_dir" -maxdepth 1 -type f -exec basename {} \; | sort | paste -sd ', ' -)"
              echo "::error title=Missing release asset::Expected non-empty $name; downloaded: ${downloaded:-none}"
              exit 1
            fi
          done

          asset_count="$(find "$asset_dir" -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [[ "$asset_count" != 4 ]]; then
            downloaded="$(find "$asset_dir" -maxdepth 1 -type f -exec basename {} \; | sort | paste -sd ', ' -)"
            echo "::error title=Unexpected asset count::Expected exactly 4 assets, found $asset_count: ${downloaded:-none}"
            exit 1
          fi

      - name: Verify SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail

          asset_dir="$RUNNER_TEMP/release-assets"
          checksum_count="$(wc -l < "$asset_dir/SHA256SUMS" | tr -d ' ')"
          if [[ "$checksum_count" != 3 ]]; then
            echo "::error title=Unexpected checksum count::Expected 3 checksum entries, found $checksum_count"
            exit 1
          fi
          (cd "$asset_dir" && sha256sum --check SHA256SUMS)

      - name: Publish verified pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail

          printf '{"draft":false,"prerelease":true}' | \
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --input - >/dev/null

          release_url="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,url \
            --jq 'select(.isDraft == false and .isPrerelease == true) | .url')"
          if [[ -z "$release_url" ]]; then
            echo "::error title=Publish verification failed::$RELEASE_TAG was not observed as a public pre-release"
            exit 1
          fi
          echo "Published $release_url"
